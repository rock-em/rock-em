<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A quiet place to practice programming. Explore problems, build your skills, and find your rhythm."
    />
    <meta name="theme-color" content="#121314" />
    <!-- Fetch the problem catalog alongside the scripts instead of after them. -->
    <link rel="preload" href="/api/catalog" as="fetch" crossorigin="anonymous" />
    <script>
      // Apply a saved light theme before the first paint. Dark is the default.
      try {
        if (localStorage.getItem("rock-em:theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').content = "#ffffff";
        }
      } catch {}
    </script>
    <style>
      html {
        background: #121314;
      }
      html[data-theme="light"] {
        background: #fff;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>rock em</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
